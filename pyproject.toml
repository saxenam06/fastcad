[project]
name = "fastcad"
version = "0.1.0"
description = "Agent-native generator of manufacturing-valid, CAE-checked variants of production CAD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Reading CAD and measuring it.
geometry = [
    "cadquery-ocp==7.9.3.1.1",
    "trimesh>=4.4",
    "rtree>=1.3",
    "scipy>=1.14",
]
# Building the mesh. Every one of these is used by the chain in docs/grc/meshing.md: gmsh meshes
# each CAD face and fills the volume, pymeshlab measures self-intersections, pymeshfix repairs
# what the collapse leaves, and pytetwild is the fallback for geometry too poor for gmsh.
mesh = [
    "gmsh>=4.13",
    "pymeshlab>=2023.12",
    "pymeshfix>=0.17",
    "pytetwild>=0.4",
    "fast-simplification>=0.1",
]
deck = [
    "h5py>=3.11",
]
plan = [
    "ortools>=9.11",
]
# Fetching the canvas from Onshape, and the figures in docs/.
tools = [
    "requests>=2.32",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastcad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fastcad"]
